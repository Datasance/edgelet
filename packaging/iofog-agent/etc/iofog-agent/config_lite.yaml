# Example profile for **lite** tarball (docker or podman only; no embedded containerd).
# Use with install.sh --flavor=lite --container-engine=docker|podman
currentProfile: production
profiles:
  production:
    containerEngine: docker
    dockerUrl: unix:///var/run/docker.sock
    diskDirectory: /var/lib/iofog-agent/
    logDirectory: /var/log/iofog-agent/
    logLevel: INFO
