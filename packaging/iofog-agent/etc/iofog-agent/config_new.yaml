    memoryConsumptionLimit: "4096"
    processorConsumptionLimit: "80.0"
    logDiskConsumptionLimit: "10.0"
    logDiskDirectory: "/var/log/iofog-agent/"
    logFileCount: "10"
    logLevel: "INFO"
    statusFrequency: "30"
    getChangesFreq: "60"
    scanDevicesFreq: "60"
    gps: "auto"
    gpsCoordinates: "0,0"
    gpsDevice: ""
    gpsScanFrequency: "60"
    isolatedDockerContainer: "off"
    edgeGuardFreq: "0"
    dockerPruningFrequency: "0"
