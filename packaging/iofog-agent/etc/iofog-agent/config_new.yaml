    #             Persistent data lives in /var/lib/iofog-agent-containerd/ and
    #             is NOT counted against diskDirectory/diskConsumptionLimit.
    containerEngine: "iofog"
    dockerUrl: "unix:///run/iofog-agent/containerd.sock"
    diskConsumptionLimit: "10"
