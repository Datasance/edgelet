#
# IOFog Agent Configuration
# This file contains all configuration profiles in a single YAML file

currentProfile: default  # default | development | production

profiles:
  default:
    controllerUrl: "http://localhost:54421/api/v3/"
    iofogUuid: ""
    secureMode: "off"
    devMode: "off"
    controllerCert: "/etc/iofog-agent/cert.crt"
    arch: "auto"
    networkInterface: "dynamic"
    # containerEngine selects the container runtime.
    # Supported values:
    #   docker  — use Docker daemon (requires Docker installed on host).
    #             dockerUrl specifies the socket path.
    #   podman  — use Podman daemon via its Docker-compatible API.
    #             dockerUrl is used as the Podman socket path; if empty,
    #             the default Podman socket is auto-detected.
    #   iofog   — use the embedded containerd engine bundled with iofog-agentd.
    #             dockerUrl is ignored; the daemon always connects to its private
    #             socket at /run/iofog-agent/containerd.sock.
    #             Persistent data lives in /var/lib/iofog-agent-containerd/ and
    #             is NOT counted against diskDirectory/diskConsumptionLimit.
    containerEngine: "iofog"
    dockerUrl: "unix:///run/iofog-agent/containerd.sock"
    diskConsumptionLimit: "10"
    diskDirectory: "/var/lib/iofog-agent/"
    memoryConsumptionLimit: "4096"
    processorConsumptionLimit: "80.0"
    logDiskConsumptionLimit: "10.0"
    logDiskDirectory: "/var/log/iofog-agent/"
    logFileCount: "10"
    logLevel: "INFO"
    statusFrequency: "30"
    getChangesFreq: "60"
    scanDevicesFreq: "60"
    gps: "auto"
    gpsCoordinates: "0,0"
    gpsDevice: ""
    gpsScanFrequency: "60"
    isolatedDockerContainer: "off"
    edgeGuardFreq: "0"
    dockerPruningFrequency: "0"
    availableDiskThreshold: "20"
    upgradeScanFrequency: "24"
    timeZone: ""
    namespace: "default"

  development:
