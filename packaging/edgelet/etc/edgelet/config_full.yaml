# Example profile for linux edgelet builds (embedded containerd available; default engine edgelet).
# dockerUrl must match the embedded socket path.
currentProfile: production
profiles:
  production:
    containerEngine: edgelet
    dockerUrl: unix:///run/edgelet/containerd.sock
    diskDirectory: /var/lib/edgelet/
    logDirectory: /var/log/edgelet/
    logLevel: INFO
