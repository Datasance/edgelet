name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'agent-go/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'agent-go/**'
      - '.github/workflows/ci-go.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent-go/go.sum
      
      - name: Run tests
        working-directory: agent-go
        run: make test
      
      - name: Run linters
        working-directory: agent-go
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          make lint
      
      - name: Check formatting
        working-directory: agent-go
        run: |
          go fmt ./...
          git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, armv7]
        include:
          - arch: amd64
            GOARCH: amd64
            GOARM: ""
          - arch: arm64
            GOARCH: arm64
            GOARM: ""
          - arch: armv7
            GOARCH: arm
            GOARM: "7"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent-go/go.sum
      
      - name: Build binaries
        working-directory: agent-go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: ${{ matrix.GOARM }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -trimpath -ldflags "-s -w" -o build/iofog-agent-${{ matrix.arch }} ./cmd/iofog-agent
          go build -trimpath -ldflags "-s -w" -o build/iofog-agentd-${{ matrix.arch }} ./cmd/iofog-agentd
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: agent-go/build/*-${{ matrix.arch }}
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: agent-go
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --tag iofog-agent:latest \
            --file Dockerfile \
            --load \
            .
      
      - name: Check image size
        run: |
          docker images iofog-agent:latest --format "{{.Size}}"
