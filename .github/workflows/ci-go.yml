name: Edgelet CI

on:
  push:
    branches: [ main, develop, edgelet/** ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'build/Dockerfile.embedded'
      - 'docs/cli/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    branches: [ main, develop, edgelet/** ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'build/Dockerfile.embedded'
      - 'docs/cli/**'
      - '.github/workflows/ci-go.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.26.2'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go version

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64.4
          args: --timeout=5m0s

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go version

      - name: Run unit tests
        run: make test-unit

      - name: CLI docs drift gate
        run: make cli-docs-check

      - name: CLI help regression
        run: make cli-help-check

      - name: EdgeletAPI v1 QA gates
        run: |
          chmod +x scripts/edgelet-api-v1-gates.sh
          ./scripts/edgelet-api-v1-gates.sh

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

  embed-ci-amd64:
    name: Embed pipeline amd64
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install embed build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc g++ pkg-config libseccomp-dev \
            libyajl-dev libcap-dev libsystemd-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            autoconf automake libtool make
      - name: Run scripts/ci (amd64)
        run: |
          chmod +x scripts/*
          EDGELET_CI_ARCHES=amd64 ./scripts/ci

  embed-ci-arm64:
    name: Embed pipeline arm64
    runs-on: ubuntu-24.04-arm
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install embed build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gcc g++ pkg-config libseccomp-dev \
            libyajl-dev libcap-dev libsystemd-dev \
            gcc-x86-64-linux-gnu gcc-arm-linux-gnueabihf \
            autoconf automake libtool make
      - name: Run scripts/ci (arm64)
        run: |
          chmod +x scripts/*
          EDGELET_CI_ARCHES=arm64 ./scripts/ci

  lite-matrix:
    name: Lite build smoke (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build lite edgelet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -tags lite \
            -ldflags "-s -w -X github.com/datasance/edgelet/internal/buildmeta.Flavor=lite" \
            -o build/edgelet-${{ matrix.goos }}-${{ matrix.goarch }}-lite ./cmd/edgelet
