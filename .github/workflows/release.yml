name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md <<EOF
          # ioFog Agent ${{ steps.version.outputs.version }}

          ## Changes

          See [CHANGELOG.md](CHANGELOG.md) for full details.

          ## Downloads

          ### Binaries
          - Linux AMD64: \`edgelet-linux-amd64-full\`, \`edgelet-linux-amd64-lite\`
          - Linux ARM64: \`edgelet-linux-arm64-full\`, \`edgelet-linux-arm64-lite\`
          - Linux ARMv7: \`edgelet-linux-arm-lite\`

          ### Packages
          - DEB: \`edgelet_${{ steps.version.outputs.version }}_amd64.deb\`
          - RPM: \`edgelet-${{ steps.version.outputs.version }}-1.x86_64.rpm\`

          ### Docker
          \`\`\`bash
          docker pull iofog/agent:${{ steps.version.outputs.version }}
          \`\`\`
          EOF
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
