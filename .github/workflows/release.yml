name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.4'
  REGISTRY: ghcr.io
  IMAGE: ${{ vars.EDGELET_CONTAINER_IMAGE }}
  GITHUB_REPO: ${{ vars.EDGELET_GITHUB_REPO }}

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            buildarch: amd64
            runner: ubuntu-latest
          - arch: arm64
            buildarch: arm64
            runner: ubuntu-24.04-arm
          - arch: arm
            buildarch: amd64
            runner: ubuntu-latest
            goarm: '7'
          - arch: riscv64
            buildarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Ubuntu Noble has no armhf/riscv64 apt indexes; embed cross builds use
      # build/Dockerfile.embedded (Debian Trixie), same as test/release/build-all.sh.
      - name: Install embed build deps
        if: matrix.arch == 'amd64' || matrix.arch == 'arm64'
        run: |
          chmod +x scripts/install-embed-build-deps
          sudo BUILDARCH=${{ matrix.buildarch }} TARGETARCH=${{ matrix.arch }} \
            ./scripts/install-embed-build-deps

      - name: Embed pipeline (Docker — arm / riscv64)
        if: matrix.arch == 'arm' || matrix.arch == 'riscv64'
        run: |
          docker build -f build/Dockerfile.embedded -t edgelet-embed-ci-amd64 .
          docker run --rm -v "$PWD:/src" -w /src edgelet-embed-ci-amd64 \
            bash -c 'chmod +x scripts/* 2>/dev/null || true; \
              ARCH=${{ matrix.arch }} ./scripts/download && \
              ARCH=${{ matrix.arch }} ./scripts/build-embedded && \
              ARCH=${{ matrix.arch }} ./scripts/build-edgelet fat && \
              ARCH=${{ matrix.arch }} ./scripts/package-data'

      - name: Build thin linux edgelet
        env:
          ARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/*
          if [ "${{ matrix.arch }}" = amd64 ] || [ "${{ matrix.arch }}" = arm64 ]; then
            ARCH=${{ matrix.arch }} ./scripts/download
            ARCH=${{ matrix.arch }} ./scripts/build-embedded
            ARCH=${{ matrix.arch }} ./scripts/build-edgelet fat
            ARCH=${{ matrix.arch }} ./scripts/package-data
          fi
          ARCH=${{ matrix.arch }} ./scripts/build-edgelet
          ARCH=${{ matrix.arch }} ./scripts/binary_size_check.sh
          test -f "build/edgelet-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edgelet-linux-${{ matrix.arch }}
          path: build/edgelet-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-desktop:
    name: Desktop ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
            out: build/edgelet-darwin-amd64
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            out: build/edgelet-darwin-arm64
          - id: windows-amd64
            goos: windows
            goarch: amd64
            out: build/edgelet-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build desktop edgelet
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-X main.version=${{ github.ref_name }} -X main.gitCommit=${{ github.sha }} -s -w" \
            -o "${{ matrix.out }}" ./cmd/edgelet
          test -f "${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edgelet-${{ matrix.id }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries
        run: |
          mkdir -p build
          find artifacts -type f -name 'edgelet-*' -exec cp {} build/ \;
          ls -la build/

      - name: Build dist/ + SHA256SUMS
        run: |
          chmod +x scripts/release-binaries.sh
          ./scripts/release-binaries.sh "${{ github.ref_name }}"
          ls -la dist/

      - name: Stamp install.sh for this publisher
        env:
          EDGELET_GITHUB_REPO: ${{ vars.EDGELET_GITHUB_REPO }}
        run: |
          test -n "$EDGELET_GITHUB_REPO"
          sed -i "s|^GITHUB_REPO=.*|GITHUB_REPO=\"\${EDGELET_GITHUB_REPO:-${EDGELET_GITHUB_REPO}}\"|" dist/install.sh
          grep '^GITHUB_REPO=' dist/install.sh
          (
            cd dist
            sha256sum edgelet-* edgelet-config.yaml.sample edgelet-controller-ca.crt.sample \
              install.sh uninstall.sh > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Generate release notes
        run: |
          cat > release_notes.md <<EOF
          # Edgelet ${{ github.ref_name }}

          ## Changes

          See [CHANGELOG.md](CHANGELOG.md) for full details.

          ## Downloads

          Raw binaries, \`SHA256SUMS\`, sample config/CA, and install scripts — no tarballs or DEB/RPM packages.

          ### Binaries
          - \`edgelet-linux-amd64\`, \`edgelet-linux-arm64\`, \`edgelet-linux-arm\`, \`edgelet-linux-riscv64\`
          - \`edgelet-darwin-amd64\`, \`edgelet-darwin-arm64\`
          - \`edgelet-windows-amd64.exe\`

          ### Container
          \`\`\`bash
          docker pull ${{ vars.EDGELET_CONTAINER_IMAGE }}:${{ github.ref_name }}
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: Push edgelet image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
