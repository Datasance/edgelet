name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: 'dev'

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            arm: 7
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build binary
        working-directory: ./agent-go
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.gitCommit=${GITHUB_SHA:0:7} -s -w" \
            -o build/iofog-agent-${{ matrix.os }}-${{ matrix.arch }} ./cmd/iofog-agent
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.gitCommit=${GITHUB_SHA:0:7} -s -w" \
            -o build/iofog-agentd-${{ matrix.os }}-${{ matrix.arch }} ./cmd/iofog-agentd
      
      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: agent-go/build/iofog-agent*-${{ matrix.os }}-${{ matrix.arch }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'workflow_dispatch'
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./agent-go
          file: ./agent-go/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: |
            iofog/agent:${{ steps.version.outputs.version }}
            iofog/agent:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GIT_COMMIT=${GITHUB_SHA:0:7}

  packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            arch: amd64
            pkg: deb
          - os: ubuntu-22.04
            arch: amd64
            pkg: deb
          - os: rhel-8
            arch: x86_64
            pkg: rpm
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binaries
        uses: actions/download-artifact@v3
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: agent-go/build/
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build DEB package
        if: matrix.pkg == 'deb'
        working-directory: ./agent-go/packaging/deb
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          ./build.sh ${{ steps.version.outputs.version }} ${{ matrix.arch }}
      
      - name: Build RPM package
        if: matrix.pkg == 'rpm'
        working-directory: ./agent-go
        run: |
          sudo yum install -y rpm-build
          # Build RPM using spec file
      
      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: packages
          path: agent-go/build/*.deb
          if-no-files-found: ignore
