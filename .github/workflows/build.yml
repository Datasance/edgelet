name: Build

on:
  # Superseded by .github/workflows/release.yml (Plan 08D).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: 'dev'

env:
  GO_VERSION: '1.24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent-go/go.sum

      - run: go version

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64.4
          args: --timeout=5m0s
          working-directory: agent-go

  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            arm: 7
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent-go/go.sum

      - run: go version

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install embed build deps
        run: |
          chmod +x scripts/install-embed-build-deps
          sudo BUILDARCH=amd64 TARGETARCH=${{ matrix.arch }} ./scripts/install-embed-build-deps

      - name: Build unified linux edgelet
        env:
          ARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
        run: |
          chmod +x scripts/*
          ARCH=${{ matrix.arch }} ./scripts/download
          ARCH=${{ matrix.arch }} ./scripts/build-embedded
          ARCH=${{ matrix.arch }} ./scripts/build-edgelet fat
          ARCH=${{ matrix.arch }} ./scripts/package-data
          ARCH=${{ matrix.arch }} ./scripts/build-edgelet
          ARCH=${{ matrix.arch }} ./scripts/binary_size_check.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/edgelet-linux-${{ matrix.arch }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'workflow_dispatch'

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./agent-go
          file: ./agent-go/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: |
            iofog/agent:${{ steps.version.outputs.version }}
            iofog/agent:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GIT_COMMIT=${GITHUB_SHA:0:7}

  packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            arch: amd64
            pkg: deb
          - os: ubuntu-22.04
            arch: amd64
            pkg: deb
          - os: rhel-8
            arch: x86_64
            pkg: rpm
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: agent-go/build/

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build DEB package
        if: matrix.pkg == 'deb'
        working-directory: ./agent-go/packaging/deb
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          ./build.sh ${{ steps.version.outputs.version }} ${{ matrix.arch }}

      - name: Build RPM package
        if: matrix.pkg == 'rpm'
        working-directory: ./agent-go
        run: |
          sudo yum install -y rpm-build
          # Build RPM using spec file

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: agent-go/build/*.deb
          if-no-files-found: ignore
