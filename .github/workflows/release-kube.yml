name: Release kube

on:
  push:
    tags:
      - 'edgelet-kube-v*\+edgelet*'

env:
  GO_VERSION: '1.26.11'
  GOWORK: 'off'

permissions: read-all

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: arm
            runner: ubuntu-latest
            cross: true
          - arch: riscv64
            runner: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kube/go.sum

      - name: No Go workspace
        run: test ! -f go.work

      - name: Aux build dependencies
        if: matrix.cross != true
        run: sudo TARGETARCH=${{ matrix.arch }} ./scripts/install-embed-build-deps

      - name: Build thin binary
        if: matrix.cross != true
        working-directory: kube
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build.sh

      - name: Build thin binary (cross)
        if: matrix.cross == true
        run: |
          set -euo pipefail
          docker build -f build/Dockerfile.embedded -t edgelet-embed-ci .
          docker run --rm \
            -e GOFLAGS=-buildvcs=false \
            -e GOWORK=off \
            -e ARCH=${{ matrix.arch }} \
            -v "$PWD:/src" -w /src \
            edgelet-embed-ci \
            bash kube/scripts/build.sh

      - name: Reported version is the Kubernetes patch
        working-directory: kube
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pin=$(awk '$1 == "kubernetes" { print $2; exit }' scripts/airgap/pins.txt)
          test -n "$pin"
          test -f build/edgelet-kube-server
          info=$(go version -m build/edgelet-kube-server)
          # Both component-base and client-go are stamped on one ldflags line.
          count=$(printf '%s\n' "$info" | grep -o -F "version.gitVersion=${pin}" | wc -l | tr -d ' ' || true)
          test "$count" -ge 2
          if printf '%s\n' "$info" | grep -F -q "gitVersion=${REF_NAME}"; then
            echo "git tag ${REF_NAME} was stamped as gitVersion" >&2
            exit 1
          fi

      - name: Stage thin binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -f kube/build/edgelet-kube
          mkdir -p dist
          install -m 0755 kube/build/edgelet-kube "dist/edgelet-kube-linux-${ARCH}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-kube-linux-${{ matrix.arch }}
          path: dist/edgelet-kube-linux-${{ matrix.arch }}
          if-no-files-found: error

  airgap:
    name: Airgap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: arm
            runner: ubuntu-latest
          - arch: riscv64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kube/go.sum

      - name: No Go workspace
        run: test ! -f go.work

      - name: Start containerd
        run: |
          set -euo pipefail
          if ! command -v ctr >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends containerd
          fi
          if ! sudo ctr version >/dev/null 2>&1; then
            sudo systemctl enable --now containerd
          fi
          sudo ctr version

      - name: Package airgap archive
        working-directory: kube
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo env \
            PATH="$PATH" \
            ARCH="$ARCH" \
            GOWORK=off \
            GOCACHE="$(go env GOCACHE)" \
            GOMODCACHE="$(go env GOMODCACHE)" \
            GOPATH="$(go env GOPATH)" \
            bash scripts/package-airgap
          test -f "build/edgelet-kube-airgap-images-${ARCH}.tar.zst"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-kube-airgap-images-${{ matrix.arch }}.tar.zst
          path: kube/build/edgelet-kube-airgap-images-${{ matrix.arch }}.tar.zst
          if-no-files-found: error
          compression-level: 0

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    needs: [build, airgap]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edgelet-kube-*
          merge-multiple: true
          path: artifacts

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'edgelet-kube-*' -exec cp -t dist {} +
          chmod 0755 \
            dist/edgelet-kube-linux-amd64 \
            dist/edgelet-kube-linux-arm64 \
            dist/edgelet-kube-linux-arm \
            dist/edgelet-kube-linux-riscv64
          (
            cd dist
            sha256sum \
              edgelet-kube-linux-amd64 \
              edgelet-kube-linux-arm64 \
              edgelet-kube-linux-arm \
              edgelet-kube-linux-riscv64 \
              edgelet-kube-airgap-images-amd64.tar.zst \
              edgelet-kube-airgap-images-arm64.tar.zst \
              edgelet-kube-airgap-images-arm.tar.zst \
              edgelet-kube-airgap-images-riscv64.tar.zst \
              > SHA256SUMS
          )
          find dist -type f -printf '%f\n' | sort > /tmp/assets.txt
          printf '%s\n' \
            SHA256SUMS \
            edgelet-kube-airgap-images-amd64.tar.zst \
            edgelet-kube-airgap-images-arm64.tar.zst \
            edgelet-kube-airgap-images-arm.tar.zst \
            edgelet-kube-airgap-images-riscv64.tar.zst \
            edgelet-kube-linux-amd64 \
            edgelet-kube-linux-arm64 \
            edgelet-kube-linux-arm \
            edgelet-kube-linux-riscv64 \
            | sort > /tmp/want.txt
          diff -u /tmp/want.txt /tmp/assets.txt
          ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (keyless cosign)
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$(basename "$f")" in
              *.pem|*.sigstore) continue ;;
            esac
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "${f}.sigstore" \
              "$f"
          done
          shopt -s nullglob
          bundles=(dist/*.sigstore)
          test "${#bundles[@]}" -gt 0
          ls -la dist/

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > release_notes.md
          printf '%s\n' \
            '' \
            '## Downloads' \
            '' \
            'Thin binaries, the airgap image archives, and `SHA256SUMS`. Each file has a keyless cosign bundle.' \
            '' \
            '- `edgelet-kube-linux-amd64`' \
            '- `edgelet-kube-linux-arm64`' \
            '- `edgelet-kube-linux-arm`' \
            '- `edgelet-kube-linux-riscv64`' \
            '- `edgelet-kube-airgap-images-amd64.tar.zst`' \
            '- `edgelet-kube-airgap-images-arm64.tar.zst`' \
            '- `edgelet-kube-airgap-images-arm.tar.zst`' \
            '- `edgelet-kube-airgap-images-riscv64.tar.zst`' \
            '- `SHA256SUMS`' \
            >> release_notes.md

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          # The product prefix contains a hyphen. A release is a pre-release only when the tag also contains -rc or -beta.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
