name: edgelet-kube conformance

on:
  workflow_dispatch:
  push:
    tags:
      - 'edgelet-kube-v*\+edgelet*'

permissions: read-all

env:
  GO_VERSION: '1.26.11'
  GOWORK: 'off'

jobs:
  artifacts:
    name: linux/amd64 release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kube/go.sum

      - name: No Go workspace
        run: test ! -f go.work

      - name: Free disk
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/.ghcup || true
          df -h

      - name: Aux build dependencies
        run: sudo TARGETARCH=amd64 ./scripts/install-embed-build-deps

      - name: Build thin binary
        working-directory: kube
        run: bash scripts/build.sh

      - name: Reported version is the Kubernetes patch
        working-directory: kube
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pin=$(awk '$1 == "kubernetes" { print $2; exit }' scripts/airgap/pins.txt)
          test -n "$pin"
          test -f build/edgelet-kube-server
          info=$(go version -m build/edgelet-kube-server)
          # Both component-base and client-go are stamped on one ldflags line.
          count=$(printf '%s\n' "$info" | grep -o -F "version.gitVersion=${pin}" | wc -l | tr -d ' ' || true)
          test "$count" -ge 2
          if printf '%s\n' "$info" | grep -F -q "gitVersion=${REF_NAME}"; then
            echo "git tag ${REF_NAME} was stamped as gitVersion" >&2
            exit 1
          fi

      - name: Stage thin binary
        run: |
          set -euo pipefail
          test -f kube/build/edgelet-kube
          mkdir -p dist
          install -m 0755 kube/build/edgelet-kube dist/edgelet-kube-linux-amd64

      - name: Start containerd
        run: |
          set -euo pipefail
          if ! command -v ctr >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends containerd
          fi
          if ! sudo ctr version >/dev/null 2>&1; then
            sudo systemctl enable --now containerd
          fi
          sudo ctr version

      - name: Package airgap archive
        working-directory: kube
        env:
          ARCH: amd64
        run: |
          set -euo pipefail
          sudo env \
            PATH="$PATH" \
            ARCH="$ARCH" \
            GOWORK=off \
            GOCACHE="$(go env GOCACHE)" \
            GOMODCACHE="$(go env GOMODCACHE)" \
            GOPATH="$(go env GOPATH)" \
            bash scripts/package-airgap
          test -f build/edgelet-kube-airgap-images-amd64.tar.zst

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-kube-linux-amd64
          path: dist/edgelet-kube-linux-amd64
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-kube-airgap-images-amd64.tar.zst
          path: kube/build/edgelet-kube-airgap-images-amd64.tar.zst
          if-no-files-found: error
          compression-level: 0

  conformance:
    name: certified-conformance
    runs-on: ubuntu-latest
    needs: [artifacts]
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    env:
      CONFORMANCE_TIMEOUT_MINUTES: "240"
      SONOBUOY_MODE: certified-conformance
      RELEASE_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kube/go.sum

      - name: No Go workspace
        run: test ! -f go.work

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edgelet-kube-*
          merge-multiple: true
          path: dist

      - name: Free disk
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/.ghcup || true
          df -h
          test -f dist/edgelet-kube-linux-amd64
          test -f dist/edgelet-kube-airgap-images-amd64.tar.zst

      - name: Run certified-conformance
        env:
          CONFORMANCE_RESULTS: ${{ github.workspace }}/sonobuoy-results.tar.gz
        run: |
          bash kube/scripts/conformance.sh \
            --binary="${GITHUB_WORKSPACE}/dist/edgelet-kube-linux-amd64" \
            --images="${GITHUB_WORKSPACE}/dist/edgelet-kube-airgap-images-amd64.tar.zst"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sonobuoy-results
          path: sonobuoy-results.tar.gz
          if-no-files-found: ignore
