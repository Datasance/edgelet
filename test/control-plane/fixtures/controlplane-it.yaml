# ControlPlane IT fixture — identity drives DNS FQDNs (not hardcoded "controller" as MS name).
# metadata.namespace=default, metadata.name=pot →
#   edgelet.controller.svc.bridge.local
#   controller.default.svc.bridge.local
#   default.pot.svc.bridge.local
apiVersion: edgelet.iofog.org/v1
kind: ControlPlane
metadata:
  name: pot
  namespace: default
spec:
  controller:
    image: ghcr.io/datasance/controller:3.7.0
    registry: 1
    port: 51121
  auth:
    url: https://auth-dt.datasance.com/
    realm: datasance
    realmKey: 
    ssl: external
    controllerClient: pot-controller
    controllerSecret: vLGWKJlXIf8GQTe2GfdubPxXedodtCU8
    viewerClient: ecn-viewer
  events:
    auditEnabled: true
    retentionDays: 14
    cleanupInterval: 86400
    captureIpAddress: true
  systemMicroservices:
    router:
      amd64: ghcr.io/datasance/router:3.7.0
      arm64: ghcr.io/datasance/router:3.7.0
      riscv64: ghcr.io/datasance/router:3.7.0
      arm: ghcr.io/datasance/router:3.7.0
    nats:
      amd64: ghcr.io/datasance/nats:2.12.4
      arm64: ghcr.io/datasance/nats:2.12.4
      riscv64: ghcr.io/datasance/nats:2.12.4
      arm: ghcr.io/datasance/nats:2.12.4
  nats:
    enabled: true
