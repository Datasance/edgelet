# ControlPlane IT fixture — identity drives DNS FQDNs (not hardcoded "controller" as MS name).
# metadata.namespace=default, metadata.name=pot →
#   edgelet.controller.svc.bridge.local
#   controller.default.svc.bridge.local
#   default.pot.svc.bridge.local
#
# Lima dev profile: HTTP + embedded OIDC (no spec.tls).
apiVersion: edgelet.iofog.org/v1
kind: ControlPlane
metadata:
  name: pot
  namespace: default
spec:
  controller:
    image: emirhandurmus/controller:3.8.0-beta.1
    registry: 1
    port: 51121
    # publicUrl: https://controller.example.com
    publicUrl: http://localhost:51121
    # trustProxy: true
  console:
    port: 8008
    url: http://localhost
  auth:
    mode: embedded
    insecureAllowHttp: true
    bootstrap:
      username: admin
      password: AdminPass123!
  events:
    auditEnabled: true
    retentionDays: 14
    cleanupInterval: 86400
    captureIpAddress: true
  systemMicroservices:
    router:
      amd64: ghcr.io/datasance/router:3.8.0-beta.0
      arm64: ghcr.io/datasance/router:3.8.0-beta.0
      riscv64: ghcr.io/datasance/router:3.8.0-beta.0
      arm: ghcr.io/datasance/router:3.8.0-beta.0
    nats:
      amd64: ghcr.io/datasance/nats:2.12.4
      arm64: ghcr.io/datasance/nats:2.12.4
      riscv64: ghcr.io/datasance/nats:2.12.4
      arm: ghcr.io/datasance/nats:2.12.4
  nats:
    enabled: true
